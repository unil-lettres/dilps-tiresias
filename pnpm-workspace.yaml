packages:
    - '.' # pins package discovery to the root only, avoiding the default recursive
    - '!data/**' # kept as a belt-and-suspenders exclusion in case

allowBuilds:
    '@parcel/watcher': false
    esbuild: true
    lmdb: false
    msgpackr-extract: false
# The minimum age of a release to be considered for dependency installation.
# The value is in minutes (1440 minutes = 1 day).
minimumReleaseAge: 1440
# List of packages to exclude from the minimum release age check.
minimumReleaseAgeExclude:
    - '@ecodev/*'

nodeLinker: hoisted

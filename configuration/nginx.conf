# Extend default mime types to be sure to recognize CSV files and serve them gziped
include mime.types;
types {
    text/csv csv;
}

# Enable gzip compression (as seen in Ubuntu's default configuration)
gzip_types text/plain text/xml text/css text/csv text/javascript application/x-javascript application/javascript application/ecmascript application/rss+xml image/svg+xml application/json application/hal+json;

gzip_vary on;

# Avoid Clickjacking attacks, see https://www.owasp.org/index.php/Clickjacking
add_header X-Frame-Options "SAMEORIGIN";
add_header Referrer-Policy strict-origin-when-cross-origin;

# All PHP URL are redirected to PHP
location ~ ^/(graphql|auth|detail/?|api/.*)$ {
  try_files $uri /index.php?$args;
}

# Avoid "File name too long" issue when params > 255 characters: serve index.html directly instead.
location ^~ /quizz {
  try_files /index.html =404;
}

# No cache for index.html to ensure users always get the latest version of the app.
location ~ index\.html$ {
  expires -1;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma "no-cache";
}

# Long cache for compiled JS/CSS since they are fingerprinted and will change when their content changes.
# Also serve the pre-gzipped file when available (must be in the same location block: nginx uses the
# first matching regex location, so a separate gzip_static block below this one would never be reached).
location ~ \.(js|css)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  gzip_static on;
}

# Long cache for fonts since they are fingerprinted and will change when their content changes.
location ~ \.(otf|eot|ttf|woff|woff2)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# Medium cache for standard images.
location ~ \.(svg|jpg|jpeg|png|gif|ico|webp)$ {
  expires 6h;
}

# Everything else that does not exists on disk redirect to Angular
location / {
  try_files $uri /index.html;
}
